<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wandelen naar 5km</title>
<meta name="theme-color" content="#2e7d5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#f6f7f5; --card:#fff; --text:#1d2420; --muted:#6b756f; --accent:#2e7d5b; --line:#e2e6e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121614; --card:#1c2320; --text:#e8ece9; --muted:#9aa59f; --accent:#5cc493; --line:#2c3531; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text);
         padding:16px 16px calc(80px + env(safe-area-inset-bottom)); }
  h1 { font-size:1.4rem; margin:.2em 0 .6em; }
  h2 { font-size:1.05rem; margin:0 0 .5em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:.4em 0; }
  .bar > div { height:100%; width:0; background:var(--accent); }
  label.row { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  label.row:first-of-type { border-top:0; }
  label.row input { width:22px; height:22px; accent-color:var(--accent); }
  .done { text-decoration:line-through; color:var(--muted); }
  form { display:flex; flex-wrap:wrap; gap:8px; }
  input[type=date], input[type=number] { flex:1 1 120px; padding:10px; border-radius:10px; border:1px solid var(--line);
         background:var(--bg); color:var(--text); font-size:16px; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  ul.log { list-style:none; padding:0; margin:0; }
  ul.log li { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  ul.log li:first-child { border-top:0; }
  ul.log li button { padding:0 8px; background:none; color:var(--muted); }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; color:var(--muted); border-radius:0; padding:14px 0; }
  nav button[aria-current=page] { color:var(--accent); font-weight:600; }
  svg { width:100%; height:140px; margin-top:10px; }
</style>
</head>
<body>
<h1>Wandelen naar 5km</h1>

<section id="schema">
  <div class="card">
    <h2>Voortgang schema</h2>
    <div class="bar"><div id="schemaBar"></div></div>
    <div class="muted" id="schemaText"></div>
  </div>
  <div id="weeks"></div>
</section>

<section id="wandel" hidden>
  <div class="card">
    <h2>Wandeling loggen</h2>
    <form id="walkForm">
      <input type="date" name="date" required>
      <input type="number" name="km" step="0.1" min="0.1" max="100" placeholder="km" required>
      <input type="number" name="min" step="1" min="1" max="1000" placeholder="minuten">
      <button>Opslaan</button>
    </form>
  </div>
  <div class="card">
    <h2>Totaal</h2>
    <div id="walkStats" class="muted"></div>
  </div>
  <div class="card"><ul class="log" id="walkLog"></ul></div>
</section>

<section id="gewicht" hidden>
  <div class="card">
    <h2>Doel</h2>
    <form id="goalForm">
      <input type="number" name="start" step="0.1" min="20" max="400" placeholder="start kg" required>
      <input type="number" name="target" step="0.1" min="20" max="400" placeholder="doel kg" required>
      <button>Opslaan</button>
    </form>
    <div class="bar"><div id="weightBar"></div></div>
    <div class="muted" id="weightText"></div>
  </div>
  <div class="card">
    <h2>Gewicht loggen</h2>
    <form id="weightForm">
      <input type="date" name="date" required>
      <input type="number" name="kg" step="0.1" min="20" max="400" placeholder="kg" required>
      <button>Opslaan</button>
    </form>
    <svg id="chart" viewBox="0 0 300 140" preserveAspectRatio="none" role="img" aria-label="Gewichtsverloop"></svg>
  </div>
  <div class="card"><ul class="log" id="weightLog"></ul></div>
</section>

<section id="meer" hidden>
  <div class="card">
    <h2>Back-up</h2>
    <p class="muted">Je gegevens staan alleen op deze telefoon. Maak af en toe een back-up.</p>
    <form>
      <button type="button" id="exportBtn">Exporteren</button>
      <button type="button" class="ghost" id="importBtn">Importeren</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </form>
  </div>
</section>

<nav>
  <button data-tab="schema" aria-current="page">Schema</button>
  <button data-tab="wandel">Wandelen</button>
  <button data-tab="gewicht">Gewicht</button>
  <button data-tab="meer">Meer</button>
</nav>

<script>
// Pas je trainingsschema hier aan: elke regel is een week, elke tekst een training.
const SCHEMA = [
  ["1,5 km rustig", "1,5 km rustig", "2 km rustig"],
  ["2 km rustig", "2 km rustig", "2 km rustig"],
  ["2,5 km rustig", "2 km stevig", "2,5 km rustig"],
  ["3 km rustig", "2,5 km stevig", "3 km rustig"],
  ["3,5 km rustig", "2 km stevig", "3,5 km rustig"],
  ["4 km rustig", "3 km stevig", "4 km rustig"],
  ["4,5 km rustig", "3 km stevig", "4,5 km rustig"],
  ["3 km rustig", "2 km stevig", "5 km — doel gehaald! 🎉"],
];

const KEY = "wandel5km";
// Alles wat binnenkomt (opslag of back-up) omzetten naar geldige getallen/datums.
const num = v => Number.isFinite(+v) && +v > 0 ? +v : null;
const date = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
const rows = (a, f) => (Array.isArray(a) ? a : []).filter(x => x && typeof x === "object").map(f).filter(Boolean);
const clean = d => ({
  done: d && d.done && typeof d.done === "object" && !Array.isArray(d.done)
    ? Object.fromEntries(Object.entries(d.done).filter(([k]) => /^\d+-\d+$/.test(k)).map(([k, v]) => [k, !!v])) : {},
  walks: rows(d?.walks, x => date(x.date) && num(x.km) && { id: num(x.id) || Math.random(), date: x.date, km: num(x.km), min: num(x.min) }),
  weights: rows(d?.weights, x => date(x.date) && num(x.kg) && { id: num(x.id) || Math.random(), date: x.date, kg: num(x.kg) }),
  goal: num(d?.goal?.start) && num(d?.goal?.target) ? { start: num(d.goal.start), target: num(d.goal.target) } : null,
});
let data;
try { data = clean(JSON.parse(localStorage.getItem(KEY))); }
catch { localStorage.setItem(KEY + ".kapot", localStorage.getItem(KEY)); data = clean(null); } // ruwe data bewaren
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { alert("Opslaan mislukt (opslag vol of privé-modus)."); }
  render();
};

const $ = s => document.querySelector(s);
const today = () => new Date().toLocaleDateString("sv"); // YYYY-MM-DD in lokale tijd
const fmtDate = d => new Date(d + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
const byDateDesc = (a, b) => b.date.localeCompare(a.date) || b.id - a.id;
const nl = x => x.toLocaleString("nl-NL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function render() {
  // Schema
  const total = SCHEMA.flat().length;
  const done = SCHEMA.flatMap((wk, w) => wk.map((_, s) => data.done[`${w}-${s}`])).filter(Boolean).length;
  $("#schemaBar").style.width = (done / total * 100) + "%";
  $("#schemaText").textContent = `${done} van ${total} trainingen gedaan`;
  $("#weeks").innerHTML = SCHEMA.map((week, w) => `
    <div class="card"><h2>Week ${w + 1}</h2>
      ${week.map((t, s) => { const k = `${w}-${s}`, on = !!data.done[k]; return `
        <label class="row"><input type="checkbox" data-k="${k}" ${on ? "checked" : ""}>
          <span class="${on ? "done" : ""}">${esc(t)}</span></label>`; }).join("")}
    </div>`).join("");

  // Wandelen
  const km = data.walks.reduce((n, x) => n + x.km, 0);
  const longest = Math.max(0, ...data.walks.map(x => x.km));
  $("#walkStats").textContent = `${data.walks.length} wandelingen · ${nl(km)} km totaal · langste ${nl(longest)} km`;
  $("#walkLog").innerHTML = data.walks.slice().sort(byDateDesc).map(x => `
    <li><span>${fmtDate(x.date)} — ${nl(x.km)} km${x.min ? ` in ${x.min} min` : ""}</span>
    <button data-del="walks" data-id="${x.id}" aria-label="Verwijderen">✕</button></li>`).join("");

  // Gewicht
  const ws = data.weights.slice().sort(byDateDesc), cur = ws[0]?.kg, g = data.goal;
  if (g) { $("#goalForm").start.value = g.start; $("#goalForm").target.value = g.target; }
  if (g && cur != null && g.start !== g.target) {
    const pct = Math.min(100, Math.max(0, (g.start - cur) / (g.start - g.target) * 100));
    $("#weightBar").style.width = pct + "%";
    $("#weightText").textContent = `Nu ${nl(cur)} kg · nog ${nl(Math.abs(cur - g.target))} kg te gaan (${pct.toFixed(0)}%)`;
  } else {
    $("#weightBar").style.width = "0";
    $("#weightText").textContent = "Stel een doel in en log je gewicht.";
  }
  $("#weightLog").innerHTML = ws.map(x => `
    <li><span>${fmtDate(x.date)} — ${nl(x.kg)} kg</span>
    <button data-del="weights" data-id="${x.id}" aria-label="Verwijderen">✕</button></li>`).join("");
  drawChart(ws.slice().reverse());
}

function drawChart(pts) {
  const svg = $("#chart");
  if (pts.length < 2) { svg.innerHTML = ""; return; }
  const kgs = pts.map(p => p.kg).concat(data.goal ? [data.goal.target] : []);
  const lo = Math.min(...kgs) - 1, hi = Math.max(...kgs) + 1;
  const y = kg => 135 - (kg - lo) / (hi - lo) * 130;
  const line = pts.map((p, i) => `${i / (pts.length - 1) * 300},${y(p.kg)}`).join(" ");
  const goal = data.goal ? `<line x1="0" x2="300" y1="${y(data.goal.target)}" y2="${y(data.goal.target)}" stroke="var(--muted)" stroke-dasharray="4" vector-effect="non-scaling-stroke"/>` : "";
  svg.innerHTML = goal + `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
}

// Events
document.addEventListener("change", e => {
  if (e.target.dataset.k) { data.done[e.target.dataset.k] = e.target.checked; save(); }
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.tab) {
    document.querySelectorAll("section").forEach(s => s.hidden = s.id !== t.dataset.tab);
    document.querySelectorAll("nav button").forEach(b => b === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
    scrollTo(0, 0);
  }
  if (t.dataset.del && confirm("Verwijderen?")) {
    data[t.dataset.del] = data[t.dataset.del].filter(x => x.id !== +t.dataset.id); save();
  }
});
$("#walkForm").onsubmit = e => {
  e.preventDefault(); const f = e.target;
  data.walks.push({ id: Date.now(), date: f.date.value, km: +f.km.value, min: +f.min.value || null });
  f.reset(); f.date.value = today(); save();
};
$("#weightForm").onsubmit = e => {
  e.preventDefault(); const f = e.target;
  data.weights.push({ id: Date.now(), date: f.date.value, kg: +f.kg.value });
  f.reset(); f.date.value = today(); save();
};
$("#goalForm").onsubmit = e => {
  e.preventDefault(); const f = e.target;
  data.goal = { start: +f.start.value, target: +f.target.value }; save();
};
$("#exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `wandel5km-backup-${today()}.json`; a.click();
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.walks) || !Array.isArray(d.weights) || typeof d.done !== "object") throw 0;
    if (confirm("Huidige gegevens vervangen door de back-up?")) { data = clean(d); save(); }
  } catch { alert("Dit is geen geldig back-upbestand."); }
  e.target.value = "";
};

document.querySelectorAll("input[type=date]").forEach(i => i.value = today());
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
