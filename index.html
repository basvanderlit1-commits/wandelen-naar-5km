<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://basvanderlit1-commits.github.io; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit 5K</title>
<meta name="theme-color" content="#070b1a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit 5K">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="44" fill="none" stroke="#232c5c" stroke-width="9"/><circle cx="60" cy="60" r="44" fill="none" stroke="#7cf6ff" stroke-width="9" stroke-linecap="round" stroke-dasharray="190 277" transform="rotate(-90 60 60)"/><circle cx="60" cy="16" r="8" fill="#a99bff" transform="rotate(155 60 60)"/><text x="60" y="69" text-anchor="middle" fill="#eef2ff" font-size="28" font-weight="700" font-family="system-ui,sans-serif" style="font-family:system-ui,sans-serif">5K</text></svg>
      <div><b>ORBIT <span>5K</span></b><h1 id="hdr-date">Vandaag</h1></div>
    </div>
    <span class="pill p-acc" id="hdr-week">Week –</span>
  </header>
  <div id="conn" class="banner b-mute" hidden></div>
  <section id="v-today"></section>
  <section id="v-agenda" hidden></section>
  <section id="v-progress" hidden></section>
  <section id="v-plan" hidden></section>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>Vandaag</button>
  <button role="tab" aria-selected="false" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Agenda</button>
  <button role="tab" aria-selected="false" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><circle cx="20" cy="6" r="1.5" fill="currentColor"/></svg>Voortgang</button>
  <button role="tab" aria-selected="false" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="3" r="1.6" fill="currentColor"/></svg>Plan</button>
</nav>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
